name: Uptime CI
on:
  schedule:
    # cada 10 min: detecta caídas de hosting casi en tiempo real (repo público = Actions ilimitados)
    - cron: "*/10 * * * *"
  repository_dispatch:
    types: [uptime]
  workflow_dispatch:
jobs:
  release:
    name: Check status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Check endpoint status
        uses: upptime/uptime-monitor@v1.41.3
        with:
          command: "update"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
          HTTP_PROXY: ${{ secrets.PROXY_URL }}
          HTTPS_PROXY: ${{ secrets.PROXY_URL }}
      - name: Cerrar issues de webs que ya están online
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          python3 << 'PYEOF'
          import subprocess, glob, yaml, os

          repo = os.environ['GITHUB_REPOSITORY']

          for path in glob.glob('history/*.yml'):
              try:
                  with open(path) as f:
                      data = yaml.safe_load(f)
              except Exception:
                  continue
              if data.get('status') != 'up':
                  continue
              slug = os.path.basename(path).replace('.yml', '')
              result = subprocess.run(
                  ['gh', 'issue', 'list', '--repo', repo, '--state', 'open',
                   '--label', slug, '--json', 'number', '--jq', '.[].number'],
                  capture_output=True, text=True)
              for num in result.stdout.strip().splitlines():
                  if num:
                      subprocess.run(
                          ['gh', 'issue', 'close', num, '--repo', repo,
                           '--comment', 'Cerrado automáticamente: el sitio está online según el último escaneo.'],
                          capture_output=True)
                      print(f'Cerrado issue #{num} ({slug})')
          PYEOF
