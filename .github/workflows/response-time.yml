name: Response Time CI
on:
  schedule:
    - cron: "0 23 * * *"
  repository_dispatch:
    types: [response_time]
  workflow_dispatch:
jobs:
  release:
    name: Check status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Update response time
        uses: upptime/uptime-monitor@v1.41.3
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
          HTTP_PROXY: ${{ secrets.PROXY_URL }}
          HTTPS_PROXY: ${{ secrets.PROXY_URL }}
      - name: Generar resumen de sitios caidos
        if: always()
        id: resumen
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
        run: |
          CAIDOS=$(gh issue list --repo ${{ github.repository }} --state open --label "status: down" --json title --jq '.[].title' | head -20 || echo "")
          TOTAL_CAIDOS=$(gh issue list --repo ${{ github.repository }} --state open --label "status: down" --json title --jq 'length' || echo "0")
          echo "total=$TOTAL_CAIDOS" >> $GITHUB_OUTPUT
          echo "lista<<EOF" >> $GITHUB_OUTPUT
          echo "$CAIDOS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Enviar resumen por email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.NOTIFICATION_EMAIL_SMTP_HOST }}
          server_port: ${{ secrets.NOTIFICATION_EMAIL_SMTP_PORT }}
          username: ${{ secrets.NOTIFICATION_EMAIL_SMTP_USERNAME }}
          password: ${{ secrets.NOTIFICATION_EMAIL_SMTP_PASSWORD }}
          subject: "Upptime - ${{ steps.resumen.outputs.total }} sitios caidos"
          to: ${{ secrets.NOTIFICATION_EMAIL_TO }}
          from: ${{ secrets.NOTIFICATION_EMAIL_FROM }}
          body: |
            Resumen del check diario de uptime.

            Sitios caidos: ${{ steps.resumen.outputs.total }}

            ${{ steps.resumen.outputs.lista }}

            Ver todos los issues:
            https://github.com/${{ github.repository }}/issues?q=label%3A%22status%3A+down%22+is%3Aopen
