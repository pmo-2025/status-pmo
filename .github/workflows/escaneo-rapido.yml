name: Escaneo rapido

# Detección real cada ~9 minutos.
#
# El escaneo en sí tarda 25 s, pero un cron "*/10" NO se cumple: GitHub
# throttlea los schedules y cuanto más frecuente es el cron, más ejecuciones
# se salta (medido el 29-jul con este mismo workflow: disparos a las 13:06 y
# 15:17, o sea cada 2 h). Por eso el cron es cada 30 min —espaciado, GitHub lo
# respeta mucho mejor— y cada ejecución hace 6 pasadas separadas 9 min hasta
# cubrir ~54 min. Con la cola de concurrency el siguiente run arranca al
# terminar este, así que la cobertura no se corta.
on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:

concurrency:
  group: escaneo-rapido
  cancel-in-progress: false

jobs:
  escanear:
    name: Comprobar todas las webs
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Instalar dependencias
        run: pip install --quiet requests pyyaml

      - name: Escanear cada 9 minutos durante ~1 hora
        env:
          PROXY_URLS: ${{ secrets.PROXY_URLS }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          git config user.name "Monitor PMO"
          git config user.email "monitor@users.noreply.github.com"

          # Uptime CI y el run anterior de este mismo workflow commitean en
          # paralelo. Antes se resolvía con "git pull --rebase", pero cuando el
          # otro lado también había tocado monitor/estado.json el rebase se
          # quedaba en conflicto, salía con código 1 y mataba el paso entero:
          # se perdían las pasadas que faltaban (runs en rojo del 21-ago).
          # Ahora no se rebasa nunca: si el push se rechaza, se vuelve a partir
          # de origin/master y se reaplican nuestros ficheros, que no pueden
          # entrar en conflicto porque sabemos cuál gana en cada uno.
          empujar_estado() {
            git add monitor/estado.json monitor/incidencias.log
            if git diff --cached --quiet; then
              echo "sin cambios de estado"
              return 0
            fi
            git commit -q -m "estado: actualizar monitor [skip ci]"
            for intento in 1 2 3; do
              if git push -q origin HEAD:master; then
                return 0
              fi
              echo "push rechazado (intento $intento): otro run empujó antes, se rehace encima"
              cp monitor/estado.json "$RUNNER_TEMP/estado.json"
              cp monitor/incidencias.log "$RUNNER_TEMP/incidencias.log"
              git fetch -q origin master
              git reset -q --hard origin/master
              # estado.json: gana nuestra medición, que es la más reciente
              cp "$RUNNER_TEMP/estado.json" monitor/estado.json
              # incidencias.log: es un histórico, se unen las dos versiones.
              # El sello de tiempo va primero, así que sort -u deja las líneas
              # en orden cronológico y sin duplicados.
              cat monitor/incidencias.log "$RUNNER_TEMP/incidencias.log" \
                | grep -v '^[[:space:]]*$' | sort -u > "$RUNNER_TEMP/union.log"
              mv "$RUNNER_TEMP/union.log" monitor/incidencias.log
              git add monitor/estado.json monitor/incidencias.log
              if git diff --cached --quiet; then
                echo "el otro run ya había guardado lo mismo"
                return 0
              fi
              git commit -q -m "estado: actualizar monitor [skip ci]"
              sleep 5
            done
            echo "no se pudo empujar el estado tras 3 intentos; se sigue escaneando"
            return 0
          }

          for pasada in 1 2 3 4 5 6; do
            echo "=== pasada $pasada de 6 ==="
            python3 monitor/escaneo.py || echo "la pasada $pasada fallo, se sigue"
            empujar_estado

            if [ "$pasada" -lt 6 ]; then sleep 540; fi
          done
